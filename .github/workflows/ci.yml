name: CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build EquipmentApi/EquipmentApi.csproj
      - run: dotnet test tests/EquipmentApi.Tests/EquipmentApi.Tests.csproj
      - run: docker build -t equipment-api .
